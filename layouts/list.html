{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <ol class="post-list">
    {{- range .Pages.ByDate.Reverse }}
      <li>
        <article>
          <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 02, 2006" }}</time>
          <p>{{ .Description | default (.Summary | plainify | truncate 120) }}</p>
        </article>
      </li>
    {{- end }}
  </ol>
{{ end }}
